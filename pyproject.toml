[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "debate-floor"
version = "0.1.0"
description = "Local debate chatroom with a blocking MCP harness for interactive agents"
requires-python = ">=3.12"
dependencies = [
    "mcp==1.26.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "wsproto>=1.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[project.scripts]
debate = "debate.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/debate"]

[tool.hatch.build.targets.wheel.sources]
"src/debate" = "debate"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
    "error::DeprecationWarning:debate.*",
]
